# Run behind an HTTPS reverse proxy on this host.
# APP_PUBLIC_ORIGIN=https://your-domain.example docker compose -f compose.production.yaml up -d --build
services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &production_environment
      APP_ENV: prod
      APP_RELOAD: "false"
      APP_DATABASE_URL: sqlite+aiosqlite:////app/data/local.db
      APP_MEDIA_STORAGE_PATH: /app/data/media
      APP_COOKIE_SECURE: "true"
      APP_SESSION_COOKIE_NAME: __Host-pb_session
      APP_CORS_ORIGINS: '["${APP_PUBLIC_ORIGIN:?Set APP_PUBLIC_ORIGIN to the HTTPS site origin}"]'
    volumes: &production_volumes
      - backend_data:/app/data
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  api:
    build: .
    environment: *production_environment
    volumes: *production_volumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend_data:
