services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      APP_ENV: dev
      APP_RELOAD: "false"
      APP_DATABASE_URL: sqlite+aiosqlite:////app/data/predatory_beavers.db
      APP_MEDIA_STORAGE_PATH: /app/data/media
      APP_COOKIE_SECURE: "false"
    volumes: &backend_volumes
      - backend_data:/app/data
    restart: "no"

  api:
    build: .
    environment: *backend_environment
    volumes: *backend_volumes
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  backend_data:
