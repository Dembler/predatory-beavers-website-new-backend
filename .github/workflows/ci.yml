name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
      APP_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.1
          uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Apply migrations
        run: |
          mkdir -p data
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Import smoke
        run: uv run python -c "from predatory_beavers.api.main import app; assert app.title"
      - name: Test
        run: uv run pytest
      - name: Container build
        run: docker build --tag predatory-beavers-backend:ci .
